[project]
name = "breaking-bad-rag"
version = "0.1.0"
description = "RAG (Retrieval-Augmented Generation) implementation using Breaking Bad plots as Knowledge Base."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "gradio>=6.15.2",
    "ollama>=0.6.2",
    "pandas>=3.0.3",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "sqlmodel>=0.0.38",
]
